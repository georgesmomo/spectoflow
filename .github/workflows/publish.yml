name: Publish to npm

# Publishes the package when you push a semver tag (e.g. v0.13.0).
# Auth uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com is required (see README / repo docs):
#   Package → Settings → Trusted Publisher → GitHub Actions
#   Repository: georgesmomo/spectoflow   Workflow: publish.yml

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # ensure the token is granted at the job level too
    steps:
      - uses: actions/checkout@v4

      # NOTE: no `registry-url:` here on purpose — it writes an .npmrc with a placeholder
      # NODE_AUTH_TOKEN that shadows OIDC and makes `npm publish` 404. Default registry +
      # OIDC trusted publishing authenticates without any token.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # OIDC trusted publishing needs npm >= 11.5.1 (newer than the one Node ships)
      - name: Upgrade npm (OIDC-capable)
        run: |
          npm install -g npm@latest
          hash -r
          echo "node=$(node -v)  npm=$(npm -v)"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::Tag v$TAG does not match package.json $PKG"; exit 1; }

      - name: Test
        run: npm test

      - name: Publish
        run: |
          echo "OIDC id-token URL present? ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          npm publish --provenance --access public --loglevel verbose
